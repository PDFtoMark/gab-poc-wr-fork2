name: CI
on:
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ok:
    runs-on: ubuntu-24.04
    steps:
      - name: Fork-controlled payload
        run: |
          echo "FORK-WORKFLOW-EXECUTED head=$GITHUB_HEAD_REF event=$GITHUB_EVENT_NAME"
          echo "FORK-WORKFLOW-EXECUTED" >> "$GITHUB_STEP_SUMMARY"
